# ContractRift + PostgreSQL. Usage:
#   cp .env.example .env   # set ENCRYPTION_KEY (npm run gen-key) and POSTGRES_PASSWORD
#   docker compose up -d --build
# Exercised in CI on every push (see the docker job in .github/workflows/ci.yml).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: contractrift
      POSTGRES_USER: contractrift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U contractrift -d contractrift']
      interval: 5s
      timeout: 5s
      retries: 10

  contractrift:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://contractrift:${POSTGRES_PASSWORD}@db:5432/contractrift
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Behind an HTTPS reverse proxy set COOKIE_SECURE=true (default in production) and TRUST_PROXY=true.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}

volumes:
  pgdata:
